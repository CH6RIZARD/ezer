<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #14111f; font: 11px sans-serif; color: #999; }
  .grid { display: grid; grid-template-columns: repeat(4, 360px); }
  .cell { height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card { width: 308px; height: 190px; position: relative; }
  .l { position: absolute; overflow: hidden; }
  .face { left: 0; top: 0; width: 308px; height: 190px; border-radius: 20px; backface-visibility: hidden; }
  .front { background: linear-gradient(135deg, #5b21b6, #2e1065 60%, #1a0b3d); }
  .back { background: linear-gradient(135deg, #3b1585, #150833); }
  .gold { background: linear-gradient(135deg, #E7C77E, #A87D2F 55%, #E7C77E); }
  .stripe { margin-top: 22px; height: 38px; background: #000; }
  .txt { position: absolute; left: 18px; top: 90px; color: #fff; font-size: 17px; letter-spacing: 1.6px; }
  .chip { position: absolute; left: 18px; top: 18px; width: 40px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #E7C77E, #A87D2F); }
</style>
<div class="grid" id="g"></div>
<script>
// Renders the SpinCard layer stack. mode=web: parent perspective + real translateZ.
// mode=native: per-layer perspective() and the screen-space shift RN native uses.
const q = new URLSearchParams(location.search);
const variant = q.get('v') || 'r';
const mode = q.get('mode') || 'web';
const D = Number(q.get('d') || 1.5);      // face depth (half thickness)
const M = Number(q.get('m') || 2);        // cross-axis inset of each side stack
const N = Number(q.get('n') || 5);        // sheets per stack
const LO = Number(q.get('lo') || 0.35), HI = Number(q.get('hi') || 0.75);
const W = 308, H = 190, R = 20;
const ANGLES = (q.get('a') || '0,0;3,5;8,12;12,20;20,8;8,35;30,30;0,50;50,0;0,70;70,10;0,85;86,3;0,89;15,170;0,-80')
  .split(';').map(s => s.split(',').map(Number));
const rad = d => d * Math.PI / 180, sin = d => Math.sin(rad(d)), cos = d => Math.cos(rad(d));
const ramp = s => Math.max(0, Math.min(1, (Math.abs(s) - LO) / (HI - LO)));

// A layer: {k, x, y, w, h, r, o}
const VARIANTS = {
  // 4:45pm / 10am: one gold core at depth 0, inset 4, faces at +-3
  old: () => ({ d: 3, gold: [{ k: 0, x: 4, y: 4, w: W - 8, h: H - 8, r: R - 4, o: 1 }] }),
  // The card the owner approved on the dev page (commit 90687a9): seven
  // full-size gold sheets between faces at +-3, faded in by |sin rx|+|sin ry|.
  dev: (rx, ry) => {
    const o = Math.max(0, Math.min(1, (Math.abs(sin(rx)) + Math.abs(sin(ry)) - 0.1) / 0.2));
    // SpinCard: 19 filled gold sheets 0.3px apart (dense, so Android's un-anti-aliased
    // hairlines overlap edge-on), shaded deep at the faces, bright mid-way.
    const ks = Array.from({ length: 19 }, (_, i) => -3 + 0.3 * (i + 1));
    return { d: 3, walls: q.get('walls') === '1', gold: ks.map(k => ({ k, x: 0, y: 0, w: W, h: H, r: R, o, solid: true, t: 1 - Math.abs(k) / 3 })) };
  },  // two per-axis stacks, each lit by how far its own side faces the viewer
  r: (rx, ry) => {
    const ks = Array.from({ length: N }, (_, i) => N === 1 ? 0 : -D + (2 * D) * (i + 0.5) / N);
    // Cross-axis inset shrinks to 0 exactly edge-on (SpinCard's span scale).
    const tx = Math.abs(sin(ry)), ty = Math.abs(sin(rx) * cos(ry));
    const my = M * (1 - tx), mx = M * (1 - ty);
    return { d: D, gold: [
      ...ks.map(k => ({ k, x: 0, y: my, w: W, h: H - 2 * my, r: R, o: ramp(tx) })),
      ...ks.map(k => ({ k, x: mx, y: 0, w: W - 2 * mx, h: H, r: R, o: ramp(ty) })),
    ] };
  },
};

// SpinCard's side walls: solid gold strips perpendicular to the faces, so
// edge-on the side is one band, not a stack of hairlines. Native has no
// translateZ, so each wall is placed at its edge's PROJECTED centre (screen
// shift + perspective scale) and turned to face outward; web uses real 3D.
const P = 1100;
function wallTf(rx, ry, side, d) {
  const turn = { right: 'rotateY(90deg)', left: 'rotateY(-90deg)', top: 'rotateX(90deg)', bottom: 'rotateX(-90deg)' }[side];
  const along = { right: `translateX(${W / 2}px)`, left: `translateX(${-W / 2}px)`, top: `translateY(${-H / 2}px)`, bottom: `translateY(${H / 2}px)` }[side];
  if (mode === 'web') return `rotateX(${rx}deg) rotateY(${ry}deg) ${along} ${turn}`;
  let x, y, z;
  if (side === 'right' || side === 'left') {
    const s = side === 'right' ? 1 : -1, h = s * W / 2;
    x = h * cos(ry); y = h * sin(ry) * sin(rx); z = -h * sin(ry) * cos(rx);
  } else {
    const s = side === 'bottom' ? 1 : -1, h = s * H / 2;
    x = 0; y = h * cos(rx); z = h * sin(rx);
  }
  const f = P / (P - z);
  return `perspective(${P}px) translate(${x * f}px, ${y * f}px) scale(${f}) rotateX(${rx}deg) rotateY(${ry}deg) ${turn}`;
}
const wallOpacity = (n, lo = Number(q.get('wlo') || 0.96), hi = Number(q.get('whi') || 0.99)) =>
  Math.max(0, Math.min(1, (Math.abs(n) - lo) / (hi - lo)));
function tf(rx, ry, k, extra = '') {
  if (mode === 'web') return `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(${k}px) ${extra}`;
  const dx = k * sin(ry), dy = -k * sin(rx) * cos(ry);
  return `perspective(1100px) translate(${dx}px, ${dy}px) rotateX(${rx}deg) rotateY(${ry}deg) ${extra}`;
}

for (const [rx, ry] of ANGLES) {
  const cell = document.createElement('div'); cell.className = 'cell';
  const card = document.createElement('div'); card.className = 'card';
  if (mode === 'web') card.style.perspective = '1100px';
  const v = VARIANTS[variant](rx, ry);
  for (const g of v.gold) {
    const e = document.createElement('div'); e.className = 'l gold';
    const ringCss = g.solid ? `background:rgb(${[168 + 63 * g.t, 125 + 74 * g.t, 47 + 79 * g.t].map(Math.round).join(',')});` : '';
    e.style.cssText = `left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px;border-radius:${g.r}px;opacity:${g.o};${ringCss}transform:${tf(rx, ry, g.k)}`;
    card.appendChild(e);
  }
  if (v.walls) {
    const d = v.d;
    for (const side of ['right', 'left', 'top', 'bottom']) {
      const e = document.createElement('div'); e.className = 'l gold';
      const vert = side === 'right' || side === 'left';
      const n = vert ? sin(ry) * cos(rx) : sin(rx);
      const w = vert ? 2 * d : W, hh = vert ? H : 2 * d;
      e.style.cssText = `left:${(W - w) / 2}px;top:${(H - hh) / 2}px;width:${w}px;height:${hh}px;border-radius:${d}px;backface-visibility:hidden;opacity:${wallOpacity(n)};transform:${wallTf(rx, ry, side, d)}`;
      card.appendChild(e);
    }
  }
  const f = document.createElement('div'); f.className = 'l face front';
  f.style.transform = tf(rx, ry, v.d); f.innerHTML = '<div class="chip"></div><div class="txt">•••• •••• •••• ••••</div>';
  const b = document.createElement('div'); b.className = 'l face back';
  b.style.transform = tf(rx, ry, -v.d, 'rotateY(180deg)'); b.innerHTML = '<div class="stripe"></div>';
  card.append(f, b);
  const lab = document.createElement('div'); lab.textContent = `${variant}/${mode} d${v.d}  rx ${rx}  ry ${ry}`; lab.style.marginTop = '40px';
  cell.append(card, lab); document.getElementById('g').appendChild(cell);
}
</script>
